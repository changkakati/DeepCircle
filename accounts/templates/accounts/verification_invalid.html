{% extends "base.html" %}

{% block title %}Invalid Verification Link | Social{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Link invalid or expired</h1>
        <p class="auth-subtitle">
            This verification link is invalid or has expired.
            Please contact support to activate your account.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-block">
            Go to login
        </a>
    </div>
</div>
{% endblock %}
